  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;

  h1 {
    font-size: 22px;

    font-size: 14px;
    margin-bottom: 30px;

    margin-bottom: 24px;
  }
  .lang-toggle button {
    display: inline-block;
    margin: 0 5px;
    padding: 10px 24px;
    background: rgba(167,139,250,0.15);
    border: 1px solid rgba(167,139,250,0.3);
    color: #e8e8e8;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .lang-toggle button.active {
    background: rgba(167,139,250,0.35);
    border-color: #a78bfa;
  }

  /* ===== BANNER BORITRADEX ===== */
  .boritradex-banner {
    width: 100%;
    max-width: 900px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #1a0f2e 0%, #0f1a2e 50%, #0a2e1f 100%);
    border: 1px solid rgba(167,139,250,0.25);
    box-shadow: 0 0 40px rgba(167,139,250,0.15);
  }
  .boritradex-banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399, #a78bfa);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .banner-inner {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 32px;
  }
  .banner-avatar {
    flex-shrink: 0;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid transparent;
    background: linear-gradient(#1a0f2e, #1a0f2e) padding-box,
                linear-gradient(135deg, #a78bfa, #60a5fa, #34d399) border-box;
    box-shadow: 0 0 25px rgba(167,139,250,0.4);
  }
  .banner-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .banner-content {
    flex: 1;
  }
  .banner-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #a78bfa;
    background: rgba(167,139,250,0.12);
    border: 1px solid rgba(167,139,250,0.3);
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .banner-title {
    font-size: clamp(20px, 3.5vw, 30px);
    font-weight: 800;
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .banner-title .highlight {
    background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .banner-desc {
    font-size: 14px;
    color: #b0b0b0;
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .social-links {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .social-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .social-btn:hover {
    transform: translateY(-2px);
  }
  .social-btn.youtube {
    background: linear-gradient(135deg, #ff0000, #cc0000);
    box-shadow: 0 4px 15px rgba(255,0,0,0.3);
  }
  .social-btn.instagram {
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    box-shadow: 0 4px 15px rgba(220,39,67,0.3);
  }
  .social-btn.tiktok {
    background: linear-gradient(135deg, #000000, #333333);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .social-btn.x {
    background: #000000;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 4px 15px rgba(255,255,255,0.1);
  }
  .social-btn svg {
    width: 18px;
    height: 18px;
    fill: #fff;
  }

  @media (max-width: 600px) {
    .banner-inner {
      flex-direction: column;
      text-align: center;
      padding: 24px 20px;
    }
    .social-links {
      justify-content: center;
    }
  }
</style>
