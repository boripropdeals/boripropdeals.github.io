<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toro Ojo Radar — Preview | BoriProp Deals</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#04070d; color:#e8f5ee; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; padding:28px 16px 60px; }
  h1 { font-size:clamp(22px,4vw,32px); letter-spacing:.08em; margin-bottom:6px; text-align:center; }
  h1 .accent { color:#59f2ad; text-shadow:0 0 20px rgba(89,242,173,.7); }
  .sub { color:#8fb8a3; font-size:13px; letter-spacing:.2em; margin-bottom:24px; text-align:center; }
  .stage { position:relative; max-width:900px; margin:0 auto; border:1px solid rgba(89,242,173,.3); border-radius:18px; overflow:hidden; box-shadow:0 0 60px rgba(89,242,173,.12); }
  .stage img { display:block; width:100%; height:auto; }
  /* animated radar sweep inside the hexagonal eye */
  .eye-sweep {
    position:absolute; left:58.7%; top:64.8%; width:7.5%; aspect-ratio:1;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
    overflow:hidden;
    background:conic-gradient(from 0deg, rgba(89,242,173,.6), transparent 32%);
    filter:blur(1px); mix-blend-mode:screen;
    animation:sweep 2.8s linear infinite;
  }
  .eye-sweep::after {
    content:''; position:absolute; inset:26%; border-radius:50%;
    border:1px solid rgba(89,242,173,.55);
    animation:ping 2.8s ease-out infinite;
  }
  @keyframes sweep { to { transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes ping { 0%{transform:scale(.65);opacity:.9} 100%{transform:scale(.95);opacity:0} }
  .eye-glow {
    position:absolute; left:58.7%; top:64.8%; width:9%; aspect-ratio:1;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(89,242,173,.25), transparent 70%);
    animation:breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:.6} 50%{opacity:1} }
  .tag { position:absolute; top:14px; left:50%; transform:translateX(-50%); font-family:monospace; font-size:11px; letter-spacing:.22em; color:#59f2ad; background:rgba(4,10,8,.7); padding:6px 14px; border-radius:6px; border:1px solid rgba(89,242,173,.3); white-space:nowrap; }
  .note { margin-top:20px; color:#6d9484; font-size:11px; letter-spacing:.12em; text-align:center; }
</style>
</head>
<body>
  <h1>TORO <span class="accent">OJO RADAR</span></h1>
  <p class="sub">VERSIÓN NATURAL · OJO EN MOVIMIENTO</p>
  <div class="stage">
    <img src="toro-ojo-radar-natural.jpg" alt="Toro con ojo radar">
    <div class="eye-glow"></div>
    <div class="eye-sweep"></div>
    <div class="tag">● BULLSEYE-1 // SCANNING</div>
  </div>
  <p class="note">PREVIEW — BORIPROP DEALS · NO PUBLICADO</p>
</body>
</html>
