<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toro Ojo Radar — Preview | BoriProp Deals</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#04070d; color:#e8f5ee; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; padding:28px 16px 60px; }
  h1 { font-size:clamp(22px,4vw,32px); letter-spacing:.08em; margin-bottom:6px; text-align:center; }
  h1 .accent { color:#59f2ad; text-shadow:0 0 20px rgba(89,242,173,.7); }
  .sub { color:#8fb8a3; font-size:13px; letter-spacing:.2em; margin-bottom:24px; text-align:center; }
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:1100px; margin:0 auto; }
  @media(max-width:760px){ .compare{grid-template-columns:1fr} }
  .card { border:1px solid rgba(89,242,173,.25); border-radius:16px; overflow:hidden; background:#070d16; }
  .card.new { border-color:#59f2ad; box-shadow:0 0 40px rgba(89,242,173,.15); }
  .card img { display:block; width:100%; height:auto; }
  .card .label { padding:12px 16px; font-size:13px; letter-spacing:.14em; color:#8fb8a3; border-top:1px solid rgba(89,242,173,.12); }
  .card.new .label { color:#59f2ad; font-weight:700; }
  .note { margin-top:22px; color:#6d9484; font-size:11px; letter-spacing:.12em; text-align:center; }
</style>
</head>
<body>
  <h1>TORO <span class="accent">OJO RADAR</span></h1>
  <p class="sub">UPDATE · EL TORO ORIGINAL INTACTO</p>
  <div class="compare">
    <div class="card">
      <img src="toro-solo-head.webp" alt="Toro original">
      <div class="label">ORIGINAL</div>
    </div>
    <div class="card new">
      <img src="toro-ojo-radar.jpg" alt="Toro con ojo radar">
      <div class="label">✦ NUEVO · OJO RADAR</div>
    </div>
  </div>
  <p class="note">PREVIEW — BORIPROP DEALS · NO PUBLICADO</p>
</body>
</html>
